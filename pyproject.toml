[project]
name = "repo-repair-agent"
version = "0.1.0"
description = "Judge-reviewed repairs for Python repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "transformers>=4.51.0",
]

[project.scripts]
repo-repair-agent = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agents", "backends", "cli", "config", "constants", "execution", "repair", "repository", "validation"]
